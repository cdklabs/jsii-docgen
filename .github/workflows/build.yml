# ~~ Generated by projen. To modify, edit .projenrc.ts and run "yarn projen".

name: build
on:
  pull_request: {}
  workflow_dispatch: {}
  merge_group: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      self_mutation_happened: ${{ steps.self_mutation.outputs.self_mutation_happened }}
    env:
      CI: "true"
      NODE_OPTIONS: --max_old_space_size=4096
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
      - name: Enable corepack
        run: corepack enable
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.13.0
          package-manager-cache: false
      - name: Install dependencies
        run: yarn install --no-immutable
      - name: build
        run: yarn projen build
      - name: Find mutations
        id: self_mutation
        run: |-
          git add .
          git diff --staged --patch --exit-code > repo.patch || echo "self_mutation_happened=true" >> $GITHUB_OUTPUT
        shell: bash
        working-directory: ./
      - name: Upload patch
        if: steps.self_mutation.outputs.self_mutation_happened
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: repo.patch
          path: repo.patch
          overwrite: true
      - name: Fail build on mutation
        if: steps.self_mutation.outputs.self_mutation_happened
        run: |-
          echo "::error::Files were changed during build (see build log). If this was triggered from a fork, you will need to update your branch."
          cat repo.patch
          exit 1
  rosetta-matrix:
    runs-on: ${{ matrix.os }}
    permissions: {}
    env:
      CI: "true"
      NODE_OPTIONS: --max_old_space_size=4096
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
      - name: Enable Corepack
        id: enable_corepack
        run: |-
          # The pre-installed Yarn Classic shims on Windows GHA runners shadow
          # Corepack's yarn proxy. Re-installing corepack globally replaces them.
          # See: https://github.com/actions/setup-node/issues/531
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            npm install -g corepack@0.34.6 --force
          fi
          corepack enable
        shell: bash
      - name: Setup Node.js
        id: setup_node_js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          package-manager-cache: false
      - name: Windows performance improvements
        id: windows_performance_improvements
        if: runner.os == 'Windows'
        run: |-
          yarn config set cacheFolder D:\a\_temp\yarn
          echo "TEMP=D:\a\_temp" >> $env:GITHUB_ENV
      - name: Install dependencies
        id: install_dependencies
        run: yarn install --no-immutable
      - name: Install Rosetta version
        id: install_rosetta_version
        run: yarn add --dev jsii-rosetta@${{ matrix.rosetta }}
      - name: compile+test
        id: compile_test
        run: |-
          yarn projen compile
          yarn projen test --runInBand
      - name: Check Rosetta version
        id: check_rosetta_version
        run: test $(yarn exec jsii-rosetta --version) = "${{ matrix.rosetta }}"
    strategy:
      matrix:
        include:
          - rosetta: 6.0.0
            os: windows-latest
        rosetta:
          - 1.85.0
          - 5.0.14
          - 5.1.2
          - 5.2.0
          - 5.3.0
          - 5.4.0
          - 5.5.0
          - 5.6.0
          - 5.7.0
          - 5.8.0
          - 5.9.1
          - 6.0.0
        os:
          - ubuntu-latest
  rosetta-compat:
    name: Rosetta Compat Tests
    needs: rosetta-matrix
    runs-on: ubuntu-latest
    permissions: {}
    env:
      CI: "true"
    if: always()
    steps:
      - name: Tests result
        id: tests_result
        run: echo ${{needs.rosetta-matrix.result}}
      - name: Set status based on matrix build
        id: set_status_based_on_matrix_build
        if: ${{ needs.rosetta-matrix.result != 'success' }}
        run: exit 1
